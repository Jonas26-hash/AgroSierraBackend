server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:agrosierra;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  # En produccion defina JWT_SECRET (minimo 32 caracteres). Si queda vacio,
  # JwtService genera una clave efimera solo para desarrollo local.
  secret: ${JWT_SECRET:}
  expiration: 3600000
